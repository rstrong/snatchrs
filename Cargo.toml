[package]
name = "snatchrs"
version = "0.1.0"
edition = "2024"
# File::try_lock
rust-version = "1.89"
description = "An incremental PyPI mirror toolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rstrong/snatchrs"
readme = "README.md"
keywords = ["pypi", "mirror", "python", "packaging", "offline"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive"] }
fs4 = { version = "1.1.0", default-features = false }
httpdate = "1"
indicatif = "0.18"
pep440_rs = "0.7"
rand = "0.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = { version = "2", features = ["serde"] }
