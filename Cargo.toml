[package]
name = "snatchrs"
version = "0.1.0"
edition = "2024"
description = "An incremental PyPI mirror toolkit"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
httpdate = "1"
indicatif = "0.18"
pep440_rs = "0.7"
rand = "0.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = { version = "2", features = ["serde"] }
